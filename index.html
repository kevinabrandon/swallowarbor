<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swallow Arbor</title>
<meta name="description" content="Swallow Arbor: a house on the California Central Coast, and the aircraft that fly over it.">
<style>
  :root { color-scheme: light dark; --bg: #faf8f4; --fg: #2b2a27; --muted: #6b675f; --link: #1f5f8b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1b19; --fg: #e8e4dc; --muted: #a39d92; --link: #8fc1e3; } }
  html { background: var(--bg); color: var(--fg); font: 18px/1.55 Georgia, "Times New Roman", serif; }
  body { margin: 0; padding: 12vh 16px 10vh; max-width: 36rem; margin-inline: auto; }
  h1 { font-weight: normal; font-size: 2.2rem; letter-spacing: 0.02em; margin: 0 0 0.3em; }
  p { margin: 0 0 1em; }
  .muted { color: var(--muted); font-size: 0.95rem; }
  a { color: var(--link); }
</style>
</head>
<body>
  <h1>Swallow Arbor</h1>
  <p>A house on the California Central Coast, and the sky above it.</p>
  <p>A small bot watches the aircraft that pass overhead and posts each one. It is the
     rebuilt <a href="https://github.com/kevinabrandon/AboveTustin">AboveTustin</a>,
     which did the same thing from a window in Tustin from 2016 to 2018.</p>
  <p class="muted">More to come.</p>
</body>
</html>
